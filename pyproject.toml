[project]
name = "nenode-ai"
version = "0.1.0"
description = "A small trainable autoregressive language model"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.18",
    "torch>=2.2",
]

[tool.setuptools]
packages = ["nenode"]

[project.scripts]
nenode-train = "nenode.train:main"
nenode-chat = "nenode.chat:main"

[tool.pytest.ini_options]
pythonpath = ["."]
