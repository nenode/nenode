<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nenode Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/brain.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    :root {
      --bg-primary: #fafaf9;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f5f5f4;
      --text-primary: #1c1917;
      --text-secondary: #78716c;
      --accent: #0f766e;
      --accent-hover: #115e59;
      --accent-light: #ccfbf1;
      --user-bg: #f0fdfa;
      --user-border: #5eead4;
      --bot-bg: #fafaf9;
      --border: #e7e5e4;
      --shadow: rgba(0, 0, 0, 0.02);
    }

    .dark {
      --bg-primary: #0c0a09;
      --bg-secondary: #1c1917;
      --bg-tertiary: #292524;
      --text-primary: #fafaf9;
      --text-secondary: #a8a29e;
      --accent: #14b8a6;
      --accent-hover: #2dd4bf;
      --accent-light: #134e4a;
      --user-bg: #134e4a;
      --user-border: #14b8a6;
      --bot-bg: #1c1917;
      --border: #292524;
      --shadow: rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background 0.3s ease, color 0.3s ease;
    }

    #chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    #chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    #chat-log::-webkit-scrollbar {
      width: 4px;
    }

    #chat-log::-webkit-scrollbar-track {
      background: transparent;
    }

    #chat-log::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    #chat-log::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    .message {
      display: flex;
      gap: 0.625rem;
      opacity: 0;
      transform: translateY(12px);
      animation: messageIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      max-width: 100%;
    }

    .user.message {
      margin-left: auto;
      flex-direction: row-reverse;
    }

    @keyframes messageIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      font-size: 0.75rem;
      flex-shrink: 0;
      margin-top: 0.125rem;
    }

    .user .message-avatar {
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: white;
    }

    .bot .message-avatar {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1.5px solid var(--border);
    }

    .message-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      max-width: calc(100% - 40px);
    }

    .message-text {
      font-size: 0.875rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-primary);
      word-wrap: break-word;
      padding: 0.625rem 0.875rem;
      border-radius: 0.875rem;
      background: var(--bg-secondary);
    }

    .user .message-text {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      border-left: 3px solid var(--accent);
    }

    .bot .message-text {
      background: var(--bot-bg);
      border: 1px solid var(--border);
    }

    .message-time {
      font-size: 0.625rem;
      font-weight: 400;
      color: var(--text-secondary);
      padding-left: 0.25rem;
    }

    .typing-indicator {
      display: flex;
      gap: 0.625rem;
      opacity: 0;
      animation: messageIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 0.875rem;
      margin-left: 36px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: typingBounce 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.3;
      }
      30% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }

    footer {
      position: sticky;
      bottom: 0;
      padding: 0.875rem;
      background: var(--bg-primary);
      border-top: 1px solid var(--border);
    }

    #chat-form {
      position: relative;
      width: 100%;
    }

    #chat-input {
      width: 100%;
      padding: 0.75rem 3rem 0.75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 1.5rem;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: var(--text-primary);
      background: var(--bg-secondary);
      transition: all 0.2s ease;
      outline: none;
    }

    #chat-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    #chat-input::placeholder {
      color: var(--text-secondary);
      font-weight: 300;
    }

    #send-btn {
      position: absolute;
      right: 0.25rem;
      top: 50%;
      transform: translateY(-50%);
      width: 2rem;
      height: 2rem;
      padding: 0;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #send-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-50%) scale(1.05);
    }

    #send-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: translateY(-50%);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 0.875rem;
      opacity: 0.4;
    }

    .empty-icon {
      font-size: 2.5rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .empty-text {
      font-size: 0.875rem;
      font-weight: 300;
      color: var(--text-secondary);
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="chat-log">
      <div class="empty-state">
        <div class="empty-icon"><i class="fas fa-comments"></i></div>
        <div class="empty-text">Start a conversation</div>
      </div>
    </div>

    <footer>
      <form id="chat-form" autocomplete="off">
        <input
          type="text"
          id="chat-input"
          maxlength="200"
          placeholder="Type a message..."
          required
        >
        <button type="submit" id="send-btn" aria-label="Send message">
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>
    </footer>
  </div>

  <script>
// Dark mode support
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.classList.add('dark');
}

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
  if (event.matches) {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark');
  }
});

// Global variables
let net;
let chatData;
let messages = [];

// DOM elements
const chatLog = document.getElementById('chat-log');
const chatForm = document.getElementById('chat-form');
const chatInput = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');

// Load data and initialize network
async function loadData() {
  try {
    const response = await fetch('data.json');
    chatData = await response.json();
    await initNetwork();
  } catch (error) {
    console.error('Error loading data:', error);
    chatData = {
      trainingData: [],
      responses: {
        default: ["I'm having trouble loading my training data. Please try again later."]
      },
      networkConfig: {
        hiddenLayers: [3],
        iterations: 2000,
        errorThresh: 0.005
      }
    };
  }
}

// Initialize Brain.js neural network
async function initNetwork() {
  net = new brain.NeuralNetwork({
    hiddenLayers: chatData.networkConfig.hiddenLayers
  });

  if (chatData.trainingData.length > 0) {
    net.train(chatData.trainingData, {
      iterations: chatData.networkConfig.iterations,
      errorThresh: chatData.networkConfig.errorThresh,
    });
  }
}

// Get random response from category
function getRandomResponse(category) {
  const options = chatData.responses[category] || chatData.responses.default;
  return options[Math.floor(Math.random() * options.length)];
}

// Tokenize text input
function tokenize(text) {
  const tokens = {};
  const words = text.toLowerCase()
    .replace(/[^\w\s]/g, '')
    .split(/\s+/)
    .filter(w => w.length > 0);

  words.forEach(word => {
    tokens[word] = 1;
  });

  return tokens;
}

// Generate response using neural network
function generateResponse(input) {
  if (!net) return getRandomResponse('default');

  const tokens = tokenize(input);
  const output = net.run(tokens);

  let maxCategory = 'default';
  let maxValue = 0;

  for (const [category, value] of Object.entries(output)) {
    if (value > maxValue && value > 0.5) {
      maxValue = value;
      maxCategory = category;
    }
  }

  return getRandomResponse(maxCategory);
}

// Format current time
function formatTime() {
  const now = new Date();
  return now.toLocaleTimeString('en-US', {
    hour: 'numeric',
    minute: '2-digit',
    hour12: true
  });
}

// Escape HTML to prevent XSS
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Render messages
function renderMessages() {
  if (messages.length === 0) {
    chatLog.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon"><i class="fas fa-comments"></i></div>
        <div class="empty-text">Start a conversation</div>
      </div>
    `;
    return;
  }

  chatLog.innerHTML = messages.map(msg => {
    const avatar = msg.sender === 'user' ? 'U' : 'N';
    return `
      <div class="message ${msg.sender}">
        <div class="message-avatar">${avatar}</div>
        <div class="message-content">
          <div class="message-text">${escapeHtml(msg.text)}</div>
          <div class="message-time">${msg.time}</div>
        </div>
      </div>
    `;
  }).join('');

  chatLog.scrollTop = chatLog.scrollHeight;
}

// Add message
function addMessage(text, sender) {
  const message = {
    text,
    sender,
    time: formatTime()
  };

  messages.push(message);
  renderMessages();
}

// Show typing indicator
function showTypingIndicator() {
  const indicator = document.createElement('div');
  indicator.className = 'typing-indicator';
  indicator.id = 'typing-indicator';
  indicator.innerHTML = `
    <div class="typing-dots">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  `;
  chatLog.appendChild(indicator);
  chatLog.scrollTop = chatLog.scrollHeight;
}

// Remove typing indicator
function removeTypingIndicator() {
  const indicator = document.getElementById('typing-indicator');
  if (indicator) {
    indicator.remove();
  }
}

// Handle form submission
async function handleSubmit(e) {
  e.preventDefault();

  const userMessage = chatInput.value.trim();
  if (!userMessage) return;

  chatInput.disabled = true;
  sendBtn.disabled = true;

  addMessage(userMessage, 'user');
  chatInput.value = '';

  showTypingIndicator();

  await new Promise(resolve => setTimeout(resolve, 800 + Math.random() * 400));

  const botResponse = generateResponse(userMessage);
  removeTypingIndicator();
  addMessage(botResponse, 'bot');

  chatInput.disabled = false;
  sendBtn.disabled = false;
  chatInput.focus();
}

// Event listeners
chatForm.addEventListener('submit', handleSubmit);

// Initialize app
async function init() {
  await loadData();
  chatInput.focus();
}

init();
  </script>
</body>
</html>
